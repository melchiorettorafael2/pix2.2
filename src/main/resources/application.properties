# Configurações da API Pix (Gerencianet/Efí)
# Cada valor pode ser sobrescrito por variável de ambiente:
# PIX_CLIENT_ID, PIX_CLIENT_SECRET, PIX_CERTIFICADO, PIX_API_URL, PIX_CHAVE

pix.client-id=SEU_CLIENT_ID
pix.client-secret=SEU_CLIENT_SECRET

# Caminho do certificado .p12 (relativo à pasta de execução ou absoluto)
pix.certificado=certs/seu-certificado.p12

# Produção: https://api-pix.gerencianet.com.br
# Homologação: https://api-pix-h.gerencianet.com.br
pix.api-url=https://api-pix.gerencianet.com.br

# Chave Pix do recebedor
pix.chave=SUA_CHAVE_PIX
